name: Build macOS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify the arm64 app
        shell: bash
        run: |
          app="$(./build.sh)"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          test "$(xcrun lipo -archs "$app/Contents/MacOS/$executable")" = arm64
          codesign --verify --strict "$app"
